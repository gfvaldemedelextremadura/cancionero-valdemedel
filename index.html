<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1637"><title>Cancionero Valdemedel</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=4.55">
<script>
(function(){
  var token='';
  try{ token=(new URLSearchParams(location.search).get('guest')||'').trim(); }catch(e){}
  window.__VM_GUEST_TOKEN=token;
  if(token) document.documentElement.classList.add('guest-boot');
})();
</script></head>
<body class="auth-locked"><script>
if(window.__VM_GUEST_TOKEN){
  document.body.classList.remove('auth-locked');
  document.body.classList.add('guest-access-mode','guest-booting');
}
</script><div id="authGate" class="auth-gate" aria-live="polite">
  <div class="auth-gate-card">
    <img src="logo-burdeos.png" alt="Grupo Folklórico Valdemedel" class="auth-gate-logo">
    <span class="auth-gate-kicker">Grupo Folklórico Valdemedel</span>
    <h1>Acceso al cancionero</h1>
    <p id="authGateText" class="auth-gate-text">Conectando con el grupo…</p>
    <div id="authGateLoading" class="auth-gate-loading"><span></span><span></span><span></span></div>
    <form id="authGateLogin" class="auth-gate-form" hidden>
      <label>Correo electrónico<input id="authGateEmail" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="authGatePassword" type="password" autocomplete="current-password" required></label>
      <div id="authGateError" class="auth-gate-error" hidden></div>
      <button class="btn auth-primary" type="submit">Entrar</button>
      <button class="btn secondary" type="button" id="authShowRegister">Crear una cuenta</button>
    </form>
    <form id="authGateRegister" class="auth-gate-form" hidden>
      <label>Nombre y apellidos<input id="authRegName" autocomplete="name" required></label>
      <label>Correo electrónico<input id="authRegEmail" type="email" autocomplete="email" required></label>
      <label>Contraseña<input id="authRegPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repite la contraseña<input id="authRegPassword2" type="password" autocomplete="new-password" minlength="8" required></label>
      <div id="authRegError" class="auth-gate-error" hidden></div>
      <button class="btn auth-primary" type="submit">Enviar solicitud</button>
      <button class="btn secondary" type="button" id="authShowLogin">Ya tengo cuenta</button>
    </form>
    <div id="authGatePending" class="auth-gate-state" hidden></div>
  </div>
</div><header class="topbar"><button id="homeBtn" class="brand" aria-label="Inicio"><img src="logo-blanco.png"><span>Cancionero Valdemedel</span></button><div class="top-actions"><button id="tunerBtn" class="icon-btn" title="Afinador cromático" aria-label="Afinador cromático">♬</button><button id="refreshAppBtn" class="icon-btn refresh-app-btn" title="Actualizar aplicación y actuaciones" aria-label="Actualizar aplicación y actuaciones">↻</button><button id="adminBtn" class="icon-btn" title="Acceso administrador">🔒</button><button id="backupBtn" class="icon-btn" title="Copia de seguridad">⇩</button><button id="themeBtn" class="icon-btn" title="Modo oscuro">◐</button></div></header>
<main id="app"><div id="guestBootFallback" class="guest-page" hidden><div class="guest-card"><img src="logo-burdeos.png" alt="Valdemedel"><span class="eyebrow dark-eyebrow">Invitación</span><h1>Acceso a la actuación</h1><p>Conectando con la actuación…</p></div></div></main>
<footer class="app-credit">Creada por Carmona para el Grupo Folklórico Valdemedel</footer><nav class="bottom-nav"><button data-view="management" class="active">◉<span>Grupo</span></button><button data-view="library">♫<span>Canciones</span></button><button data-view="repertoire">☷<span>Repertorio</span></button><button data-view="performances">★<span>Actuaciones</span></button><button data-view="settings">⚙<span>Datos</span></button></nav>
<input type="file" id="importFile" accept="application/json" hidden><script>
if(window.__VM_GUEST_TOKEN){
  var g=document.getElementById('authGate'); if(g) g.hidden=true;
  var f=document.getElementById('guestBootFallback'); if(f) f.hidden=false;
}
</script>
<script>
window.__VM_APP_LOADED=false;
window.__VM_SCRIPT_ERROR='';
</script>
<script src="supabase-config.js?v=4.55" onerror="window.__VM_SCRIPT_ERROR='No se cargó la configuración'"></script>
<script src="supabase-lite.js?v=4.55" onerror="window.__VM_SCRIPT_ERROR='No se cargó la conexión'"></script>
<script src="app.js?v=4.55" onload="window.__VM_APP_LOADED=true" onerror="window.__VM_SCRIPT_ERROR='No se cargó la aplicación'"></script>
<script>
(function(){
  setTimeout(function(){
    if(window.__VM_APP_LOADED)return;
    var loading=document.getElementById('authGateLoading');
    var login=document.getElementById('authGateLogin');
    var text=document.getElementById('authGateText');
    var error=document.getElementById('authGateError');
    if(loading)loading.hidden=true;
    if(login)login.hidden=false;
    if(text)text.textContent='No se pudo cargar la aplicación.';
    if(error){
      error.textContent=(window.__VM_SCRIPT_ERROR||'El archivo principal no respondió.')+' Cierra la app y vuelve a abrirla.';
      error.hidden=false;
    }
  },15000);
})();
</script>


</body></html>
